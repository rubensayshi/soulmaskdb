[package]
name = "screenread"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
xcap = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "screenread_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "screenread"
path = "src/main.rs"
